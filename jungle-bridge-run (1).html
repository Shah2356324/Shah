<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jungle Bridge Run</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#7fd0ff;font-family:'Lilita One',Impact,'Arial Black',sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;width:100%;height:100%}
.pill{background:rgba(20,30,80,.72);border:3px solid #ffd21a;border-radius:999px;padding:6px 18px;font-size:26px;letter-spacing:1px;text-shadow:0 2px 0 #0007}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:12px;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));pointer-events:none}
.coin::before{content:"";display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(#fff3a0,#ffc21a 70%,#c98410);border:2px solid #a8670a;margin-right:8px;vertical-align:-2px}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:radial-gradient(ellipse at center,rgba(20,30,90,.15),rgba(10,15,60,.62));padding:20px}
.title{font-size:clamp(54px,11vw,120px);line-height:.9;transform:skew(-8deg) rotate(-3deg);background:linear-gradient(#fff04a,#ff7a18);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:6px #2b1466;paint-order:stroke fill;filter:drop-shadow(0 6px 0 #2b1466)}
.sub{font-size:clamp(34px,6vw,64px);transform:skew(-8deg) rotate(-3deg);color:#8af0ff;-webkit-text-stroke:5px #14306b;paint-order:stroke fill;margin-top:-4px}
button{font-family:inherit;font-size:34px;letter-spacing:2px;color:#fff;background:linear-gradient(#4ee06a,#1fa844);border:4px solid #0c5a24;border-radius:18px;padding:10px 54px;margin-top:16px;cursor:pointer;box-shadow:0 7px 0 #0c5a24;text-shadow:0 3px 0 #0c5a24}
button:active{transform:translateY(5px);box-shadow:0 2px 0 #0c5a24}
button:focus-visible{outline:4px solid #fff}
.help{font-size:18px;opacity:.95;text-shadow:0 2px 0 #0008;max-width:520px;font-family:system-ui,sans-serif;font-weight:600}
.stat{font-size:30px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;background:#3a8fe8;text-align:center;padding:20px}
#turn{position:fixed;left:50%;top:26%;transform:translateX(-50%);font-size:clamp(34px,7vw,70px);color:#fff04a;-webkit-text-stroke:5px #14306b;paint-order:stroke fill;text-shadow:0 6px 0 #0006;pointer-events:none;animation:pulse .5s infinite alternate}
@keyframes pulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.18)}}
[hidden]{display:none!important}
</style></head><body>
<div id="hud" hidden><div class="pill"><span id="score">0</span> m</div><div class="pill coin"><span id="coins">0</span></div></div>
<div id="turn" hidden>&#9664; TURN</div>
<div id="menu" class="panel" hidden>
  <div class="title">JUNGLE<br>BRIDGE</div><div class="sub">RUN</div>
  <button id="play">PLAY</button>
  <div class="help">Corners: press Left / Right (A / D) to turn. On straight track: Left / Right = lane, Up / Space = jump, Down / S = slide. Phone: swipe.</div>
  <div class="pill coin" style="font-size:22px">Best <span id="best" style="margin-left:8px">0</span></div>
</div>
<div id="over" class="panel" hidden>
  <div id="overTitle" class="title" style="font-size:clamp(46px,9vw,90px)">CRASHED!</div>
  <div class="stat"><span id="overScore">0</span> m &nbsp;·&nbsp; <span class="coin"><span id="overCoins">0</span></span></div>
  <div class="stat" style="color:#ffd21a">Best <span id="overBest">0</span></div>
  <button id="again">RUN AGAIN</button>
</div>
<div id="loading">Loading jungle...</div>
<script>
(function(){
  var urls=['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js'];
  function next(){
    if(!urls.length){document.getElementById('loading').textContent='Could not load three.js. Check your internet connection and reload.';return;}
    var s=document.createElement('script');s.src=urls.shift();
    s.onload=function(){try{startGame();}catch(e){document.getElementById('loading').textContent='Error: '+e.message;console.error(e);}};
    s.onerror=next;document.head.appendChild(s);
  }
  window.addEventListener('DOMContentLoaded',next);
  if(document.readyState!=='loading')next();
})();
</script>

/* ===== Jungle Bridge Run : everything is built from cubes (boxes) ===== */
function startGame(){
  const names=Object.keys(TP),IMG={};let left=names.length;
  names.forEach(n=>{const i=new Image();i.onload=i.onerror=()=>{IMG[n]=i;if(--left===0)main(IMG);};i.src=TP[n].src;});
}
function main(IMG){
'use strict';
const T=THREE,$=id=>document.getElementById(id);
const PW=7.2,LANE=2.2,CD=9,TL=4,WATER=-6.5,FT=0.8;
const rnd=a=>{let s=a>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};};

/* ---------- renderer / scene ---------- */
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight);
document.body.insertBefore(renderer.domElement,document.body.firstChild);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(62,innerWidth/innerHeight,0.3,700);
scene.fog=new T.Fog(0xcdeaff,90,380);
scene.add(new T.HemisphereLight(0xe6f4ff,0x7a9a58,0.95));
const sun=new T.DirectionalLight(0xfff0cc,0.85);sun.position.set(-40,70,30);scene.add(sun);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

/* ---------- canvas textures ---------- */
function cvs(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function ctex(c){const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=4;return t;}
function itex(im){const t=new T.Texture(im);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=4;t.needsUpdate=true;return t;}
(function sky(){const c=cvs(4,256),x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#2f8cf0');g.addColorStop(0.55,'#7cc8ff');g.addColorStop(1,'#d9f1ff');x.fillStyle=g;x.fillRect(0,0,4,256);scene.background=new T.CanvasTexture(c);})();
function rockTex(base,seed){const R=rnd(seed),S=256,c=cvs(S,S),x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,S,S);
  for(let i=0;i<900;i++){x.fillStyle=R()<0.5?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.07)';const w=4+R()*22,h=3+R()*14;x.fillRect(R()*S,R()*S,w,h);}
  x.strokeStyle='rgba(60,45,40,0.55)';x.lineWidth=2;
  for(let k=0;k<7;k++){let px=R()*S,py=R()*S;x.beginPath();x.moveTo(px,py);for(let j=0;j<5;j++){px+=(R()-0.5)*50;py+=(R()-0.2)*38;x.lineTo(px,py);}x.stroke();}
  x.strokeStyle='rgba(255,255,255,0.28)';x.lineWidth=3;x.strokeRect(2,2,S-4,S-4);
  return ctex(c);}
const waterTex=(function(){const R=rnd(7),S=256,c=cvs(S,S),x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,S);g.addColorStop(0,'#1d98e6');g.addColorStop(1,'#38c2f6');x.fillStyle=g;x.fillRect(0,0,S,S);
  x.lineWidth=3;for(let i=0;i<46;i++){const y=R()*S,a=3+R()*5,ph=R()*6.28,k=1+Math.floor(R()*2),x0=R()*S;x.strokeStyle='rgba(255,255,255,'+(0.18+R()*0.25)+')';
    for(const dy of[-S,0,S]){x.beginPath();for(let u=0;u<=60;u++){const xx=x0+u*2.2,yy=y+dy+Math.sin(u*0.3*k+ph)*a;x.lineTo(xx%S,yy);}x.stroke();}}
  return ctex(c);})();
const fallTex=(function(){const R=rnd(11),W=64,H=256,c=cvs(W,H),x=c.getContext('2d');x.fillStyle='#bfeaff';x.fillRect(0,0,W,H);
  for(let i=0;i<46;i++){const px=R()*W,w=1+R()*4;x.fillStyle=R()<0.55?'rgba(255,255,255,0.8)':'rgba(70,170,235,0.5)';x.fillRect(px,0,w,H);}
  for(let i=0;i<30;i++){x.fillStyle='rgba(255,255,255,0.7)';x.fillRect(R()*W,R()*H,2+R()*6,10+R()*30);}

  const p=newPiece('S',len);
  const B=buildStraight(p,R,first);decorate(p,B,R,first);
  if(p.coins.length){const g=new T.CylinderGeometry(0.42,0.42,0.12,12);g.rotateX(Math.PI/2);p.coinMesh=new T.InstancedMesh(g,coinMat,p.coins.length);p.coinMesh.frustumCulled=false;p.group.add(p.coinMesh);}
  finishPiece(p,B);
  gen.x+=FX(gen.angle)*len;gen.z+=FZ(gen.angle)*len;
  /* corner */
  let d=R()<0.5?1:-1;if(gen.run>=2&&gen.lastTurn===d)d=-d;
  gen.run=(gen.lastTurn===d)?gen.run+1:1;gen.lastTurn=d;gen.count++;
  const c=newPiece('C',CD,d);const R2=rnd(5000+n*17);
  const CB=buildCorner(c,R2);finishPiece(c,CB);
  const ex=toWorld(c,-(PW/2)*d,-CD/2);gen.x=ex[0];gen.z=ex[1];gen.angle+=d*Math.PI/2;
}
function disposePiece(p){scene.remove(p.group);for(const m of p.meshes)m.geometry.dispose();
  if(p.coinMesh)p.coinMesh.dispose();if(p.disp){p.disp[0].dispose();p.disp[1].dispose();}p.dead=true;}
function resetWorld(){for(const p of PIECES)if(!p.dead)disposePiece(p);PIECES.length=0;gen={x:0,z:0,angle:0,count:0,lastTurn:0,run:0};for(let k=0;k<3;k++)genPair();}

/* ---------- water, far scenery ---------- */
const water=new T.Mesh(new T.PlaneGeometry(1500,1500),waterMat);water.rotation.x=-Math.PI/2;water.position.y=WATER;scene.add(water);
const far=new T.Group();scene.add(far);
(function(){const B=batches(),R=rnd(77);
  for(let k=0;k<26;k++){const a=k/26*6.283+R()*0.2,r=190+R()*150,x=Math.cos(a)*r,z=Math.sin(a)*r,h=26+R()*46,w=16+R()*18;
    let y=WATER-2,cw=w;const nl=2+Math.floor(R()*3);
    for(let j=0;j<nl;j++){const hh=h/nl;B.rock.box(x,y+hh/2,z,cw,hh,cw*(0.8+R()*0.4),shade(0xffffff,0.9+R()*0.15),0,R(),0);y+=hh;cw*=0.78;}
    B.grass.box(x,y+0.4,z,cw+3,1,cw+3,0xffffff);palm(B,x,y+0.9,z,6+R()*4,R);
    for(let j=0;j<3;j++)palm(B,x+(R()-0.5)*cw,y+0.9,z+(R()-0.5)*cw,5+R()*3,R);}
  for(const k in B){const m=B[k].mesh();if(m)far.add(m);}
  const cm=new T.MeshBasicMaterial({color:0xffffff,fog:false}),cb=new T.BoxGeometry(1,1,1);
  for(let k=0;k<22;k++){const a=R()*6.283,r=120+R()*320,g=new T.Group();
    for(let j=0;j<5;j++){const m=new T.Mesh(cb,cm);m.scale.set(14+R()*18,5+R()*5,10+R()*8);m.position.set((R()-0.5)*30,(R()-0.5)*4,(R()-0.5)*10);g.add(m);}
    g.position.set(Math.cos(a)*r,70+R()*50,Math.sin(a)*r);far.add(g);}
})();

/* ---------- the explorer (cubes) ---------- */
const player=new T.Group(),pm=c=>new T.MeshLambertMaterial({color:c}),bx=new T.BoxGeometry(1,1,1);
function part(parent,w,h,d,c,x,y,z){const m=new T.Mesh(bx,pm(c));m.scale.set(w,h,d);m.position.set(x,y,z);parent.add(m);return m;}
const body=new T.Group();player.add(body);
part(body,0.72,0.82,0.42,0xd9822b,0,1.15,0);part(body,0.74,0.22,0.44,0x6b3f1f,0,0.78,0);
part(body,0.54,0.54,0.54,0xf0b88a,0,1.82,0);part(body,0.12,0.12,0.04,0x222222,-0.14,1.86,-0.29);part(body,0.12,0.12,0.04,0x222222,0.14,1.86,-0.29);
part(body,0.8,0.08,0.8,0x6a4a22,0,2.12,0);part(body,0.56,0.26,0.56,0x8a6a32,0,2.28,0);part(body,0.58,0.08,0.58,0xb02a2a,0,2.17,0);
part(body,0.52,0.6,0.28,0xb03a2a,0,1.2,0.35);
function limb(w,h,d,c,x,y){const g=new T.Group();g.position.set(x,y,0);part(g,w,h,d,c,0,-h/2,0);body.add(g);return g;}
const armL=limb(0.2,0.7,0.22,0xf0b88a,-0.48,1.5),armR=limb(0.2,0.7,0.22,0xf0b88a,0.48,1.5),legL=limb(0.26,0.78,0.28,0x3a5a9a,-0.2,0.78),legR=limb(0.26,0.78,0.28,0x3a5a9a,0.2,0.78);
const blob=new T.Mesh(new T.CircleGeometry(0.55,16),new T.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.32}));blob.rotation.x=-Math.PI/2;
scene.add(player);scene.add(blob);

/* ---------- game state ---------- */
const S={mode:'menu',piece:0,s:0,lat:0,lane:0,y:0,vy:0,speed:0,slide:0,dist:0,coins:0,face:0,pending:null,t:0,fallT:0,deadT:0,run:0,shake:0};
let best=0;try{best=+localStorage.getItem('jbr_best')||0;}catch(e){}
$('best').textContent=best;
const camPos=new T.Vector3(0,5,6),camLook=new T.Vector3(0,2.5,-40),viewYaw=0;let vYaw=0;
function pos(p,s,lat){return[p.ox+FX(p.angle)*s+RX(p.angle)*lat,p.oz+FZ(p.angle)*s+RZ(p.angle)*lat];}
function startRun(){
  resetWorld();Object.assign(S,{mode:'play',piece:0,s:12,lat:0,lane:0,y:0,vy:0,speed:12,slide:0,dist:0,coins:0,face:0,pending:null,fallT:0,deadT:0,shake:0});
  vYaw=0;$('menu').hidden=true;$('over').hidden=true;$('hud').hidden=false;
}
function endRun(why){
  if(S.mode==='over')return;S.mode='over';const d=Math.floor(S.dist);
  if(d>best){best=d;try{localStorage.setItem('jbr_best',best);}catch(e){}}
  $('overTitle').textContent=why==='fall'?'YOU FELL!':'CRASHED!';
  $('overScore').textContent=d;$('overCoins').textContent=S.coins;$('overBest').textContent=best;$('best').textContent=best;
  $('hud').hidden=true;$('turn').hidden=true;$('over').hidden=false;
}
/* ---------- input ---------- */
function curPiece(){return PIECES[S.piece];}
function toCorner(){const p=curPiece();return p.type==='S'?p.len-S.s:-1;}
function doTurn(c){
  const d=c.d,f=S.s-CD/2,lat=S.lat;
  S.piece++;S.s=-d*lat-PW/2;S.lat=Math.max(-PW/2,Math.min(PW/2,d*f));S.lane=Math.max(-1,Math.min(1,Math.round(S.lat/LANE)));S.pending=null;S.shake=0.25;
}
function press(dir){ /* dir: +1 = left, -1 = right */
  if(S.mode!=='play')return;const p=curPiece();
  if(p.type==='C'){if(dir===p.d){if(S.s>=0.9)doTurn(p);else S.pending={dir,t:0.5};}return;}
  const tc=toCorner();
  if(tc<18){S.pending={dir,t:0.7};return;}
  S.lane=Math.max(-1,Math.min(1,S.lane-dir));
}
function jump(){if(S.mode==='play'&&S.y<=0.01){S.vy=16.5;S.slide=0;}}
function slide(){if(S.mode!=='play')return;if(S.y>0.01)S.vy=Math.min(S.vy,-22);S.slide=0.75;}
addEventListener('keydown',e=>{const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')press(1);else if(k==='ArrowRight'||k==='d'||k==='D')press(-1);
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ')jump();else if(k==='ArrowDown'||k==='s'||k==='S')slide();
  else if(k==='Enter'){if(S.mode==='menu'||S.mode==='over')startRun();}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();});
let tx=0,ty=0,tOn=false;
addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;tOn=true;},{passive:true});
addEventListener('touchmove',e=>{if(!tOn)return;const t=e.touches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy)){press(dx<0?1:-1);tOn=false;}else if(Math.abs(dy)>28){if(dy<0)jump();else slide();tOn=false;}},{passive:true});
addEventListener('touchend',()=>{tOn=false;},{passive:true});
$('play').onclick=startRun;$('again').onclick=startRun;

/* ---------- update ---------- */
const _cm=new T.Matrix4(),_cq=new T.Quaternion(),_ce=new T.Euler(),_cp=new T.Vector3(),_cs=new T.Vector3();
function updateCoins(p,t){
  if(!p.coinMesh)return;const cs=p.coins;
  for(let i=0;i<cs.length;i++){const c=cs[i];_ce.set(0,t*3+i*0.6,0);_cq.setFromEuler(_ce);_cp.set(c.lat,c.y,-c.s);const k=c.got?0.0001:1;_cs.set(k,k,k);_cm.compose(_cp,_cq,_cs);p.coinMesh.setMatrixAt(i,_cm);}
  p.coinMesh.instanceMatrix.needsUpdate=true;
}
function step(dt){
  S.t+=dt;
  if(S.mode==='play'||S.mode==='fall'||S.mode==='dead'){
    const p=curPiece();
    if(S.mode==='play'){
      S.speed=Math.min(21,12+S.dist*0.0032);S.s+=S.speed*dt;S.dist+=S.speed*dt;
      if(S.pending){S.pending.t-=dt;if(S.pending.t<=0)S.pending=null;}
      if(p.type==='S'&&S.s>=p.len){S.piece++;S.s-=p.len;}
      else if(p.type==='C'){if(S.pending&&S.pending.dir===p.d&&S.s>=0.9)doTurn(p);else if(S.s>=CD+0.4){S.mode='fall';S.fallT=0;S.vy=0;}}
      S.lat+=(S.lane*LANE-S.lat)*Math.min(1,dt*13);
      /* vertical */
      if(S.slide>0)S.slide-=dt;
      S.vy-=42*dt;S.y+=S.vy*dt;
      const q=curPiece();let gapNow=false;
      if(q.type==='S')for(const g of q.gaps)if(S.s>g[0]+0.25&&S.s<g[1]-0.25)gapNow=true;
      if(S.y<=0&&!gapNow){S.y=0;S.vy=0;}
      else if(S.y<-0.4&&gapNow){S.mode='fall';S.fallT=0;}
      /* collisions */
      if(q.type==='S'&&S.mode==='play'){
        const top=S.y+(S.slide>0?0.8:1.85);
        for(const o of q.obs){if(S.s+0.3>o.s0&&S.s-0.3<o.s1&&S.y<o.y1-0.02&&top>o.y0){
          for(let l=0;l<3;l++)if(o.mask[l]&&Math.abs(S.lat-(l-1)*LANE)<1.45){S.mode='dead';S.deadT=0;S.shake=0.6;break;}
          if(S.mode==='dead')break;}}
        for(const c of q.coins){if(!c.got&&Math.abs(S.s-c.s)<1.0&&Math.abs(S.lat-c.lat)<1.2&&Math.abs(S.y+0.9-c.y)<1.5){c.got=true;S.coins++;}}
      }
    }else if(S.mode==='fall'){S.fallT+=dt;S.vy-=36*dt;S.y+=S.vy*dt;S.s+=S.speed*0.55*dt;if(S.fallT>1.1)endRun('fall');}
    else{S.deadT+=dt;S.speed=Math.max(0,S.speed-60*dt);S.s+=S.speed*dt;if(S.deadT>0.85)endRun('crash');}
    /* keep the world generated ahead, drop what is behind */
    while(PIECES.length-S.piece<8)genPair();
    for(let i=0;i<S.piece-2;i++)if(!PIECES[i].dead)disposePiece(PIECES[i]);
  }
  /* player transform */
  const p=PIECES[Math.min(S.piece,PIECES.length-1)];
  const wp=pos(p,S.s,S.lat);
  player.position.set(wp[0],S.y,wp[1]);
  let da=p.angle-S.face;S.face+=da*Math.min(1,dt*10);player.rotation.y=S.face;
  S.run+=dt*S.speed*0.55;const sw=S.mode==='play'&&S.y<=0.02?Math.sin(S.run)*0.95:0.3;
  legL.rotation.x=sw;legR.rotation.x=-sw;armL.rotation.x=-sw*0.9;armR.rotation.x=sw*0.9;
  if(S.y>0.05){armL.rotation.x=armR.rotation.x=-2.5;legL.rotation.x=0.6;legR.rotation.x=-0.4;}
  body.position.y=S.mode==='play'&&S.y<=0.02?Math.abs(Math.sin(S.run))*0.08:0;
  body.rotation.x=S.slide>0&&S.mode==='play'?-1.25:(S.mode==='dead'?-Math.min(1.6,S.deadT*3):0);
  body.position.z=S.slide>0&&S.mode==='play'?-0.1:0;
  if(S.slide>0&&S.mode==='play')body.position.y=-0.55;
  blob.visible=S.y>-0.3&&S.mode!=='fall';blob.position.set(wp[0],0.04,wp[1]);blob.scale.setScalar(Math.max(0.4,1-S.y*0.25));
  /* camera */
  let tp,tl;
  if(S.mode==='menu'){tp=[0,4.8,6.5];tl=[0,2.6,-40];}
  else{
    vYaw+=(p.angle-vYaw)*Math.min(1,dt*5);
    const fx=FX(vYaw),fz=FZ(vYaw),rx=RX(vYaw),rz=RZ(vYaw),cy=S.mode==='fall'?Math.max(S.y,-1)+3.6:3.9+S.y*0.35;
    const lx=S.lat*0.55;
    tp=[wp[0]-fx*7.4+rx*(lx-S.lat)+0,cy,wp[1]-fz*7.4+rz*(lx-S.lat)];
    tl=[wp[0]+fx*10+rx*lx*0.2,1.5+S.y*0.3,wp[1]+fz*10];
    if(S.mode==='fall'){tl[1]=Math.max(S.y,-3)+0.6;}
  }
  const k=1-Math.exp(-dt*(S.mode==='menu'?4:9));
  camPos.x+=(tp[0]-camPos.x)*k;camPos.y+=(tp[1]-camPos.y)*k;camPos.z+=(tp[2]-camPos.z)*k;
  camLook.x+=(tl[0]-camLook.x)*k;camLook.y+=(tl[1]-camLook.y)*k;camLook.z+=(tl[2]-camLook.z)*k;
  S.shake=Math.max(0,S.shake-dt*1.6);
  camera.position.set(camPos.x+(Math.random()-0.5)*S.shake*0.5,camPos.y+(Math.random()-0.5)*S.shake*0.5,camPos.z);camera.lookAt(camLook);
  /* world animation */
  water.position.x=Math.round(camera.position.x/16.67)*16.67;water.position.z=Math.round(camera.position.z/16.67)*16.67;
  waterTex.offset.x+=dt*0.004;waterTex.offset.y-=dt*0.0025;fallTex.offset.y-=dt*1.1;
  far.position.set(camera.position.x,0,camera.position.z);
  for(let i=Math.max(0,S.piece-1);i<Math.min(PIECES.length,S.piece+3);i++)updateCoins(PIECES[i],S.t);
  /* hud */
  if(S.mode==='play'){
    $('score').textContent=Math.floor(S.dist);$('coins').textContent=S.coins;
    const q=curPiece();let hint=null;
    if(q.type==='S'&&q.len-S.s<55){hint=PIECES[S.piece+1].d;}else if(q.type==='C')hint=q.d;
    const tn=$('turn');if(hint===null)tn.hidden=true;else{tn.hidden=false;tn.innerHTML=hint>0?'&#9664; TURN':'TURN &#9654;';}
  }
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;step(dt);renderer.render(scene,camera);requestAnimationFrame(loop);}
resetWorld();$('loading').hidden=true;$('menu').hidden=false;
requestAnimationFrame(loop);
window.__JB={S,PIECES,step,press,jump,slide,startRun,toWorld};
}
</script>
